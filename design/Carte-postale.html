    <h1 style="margin:0;font-size:32px;line-height:1.06;font-weight:400;letter-spacing:-.035em;color:#e6361d;">Une carte pour une femme qui compte.</h1>
    <p style="margin:0;font-size:17px;line-height:1.6;color:#c42c14;">On l'imprime et on la poste pour toi. Elle contient un code qui lui offre son premier mois de chemin.</p>

<input placeholder="Inès Martin" style="box-sizing:border-box;width:100%;border:1.5px solid #f7beca;border-radius:16px;background:#ffffff;font-family:'DMSans',system-ui,sans-serif;font-size:16px;line-height:1.5;color:#510004;height:52px;padding:0 16px;"></label>
