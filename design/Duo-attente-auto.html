@keyframes monte{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.an-monte{animation:monte .7s cubic-bezier(.2,.7,.2,1) both}
.an-trace{animation:trace 1.6s cubic-bezier(.4,0,.2,1) both}
.an-anneau{animation:trace 1.2s .5s cubic-bezier(.4,0,.2,1) both}
.an-pt{transform-box:fill-box;transform-origin:center;animation:point .5s cubic-bezier(.2,.7,.2,1) both}
.an-ici{animation:point .5s cubic-bezier(.2,.7,.2,1) both,halo 2.6s 2.4s ease-in-out infinite}
.an-pouls{animation:pouls 2s ease-out infinite}
.an-carte{transition:transform .2s ease,box-shadow .2s ease}
.an-carte:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(81,0,4,.14)}
.pg:hover .an-monte{animation-name:monteB}
.pg:hover .an-trace,.pg:hover .an-anneau{animation-name:traceB}
.pg:hover .an-pt{animation-name:pointB}
.pg:hover .an-ici{animation-name:pointB,halo}
@media (prefers-reduced-motion:reduce){.an-monte,.an-trace,.an-anneau,.an-pt,.an-ici,.an-pouls{animation:none}}
