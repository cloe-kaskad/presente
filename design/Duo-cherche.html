<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L'attente, le moment animé</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Anton';src:url(assets/Anton.woff2) format('woff2');font-display:swap}
@font-face{font-family:'DMSans';src:url(assets/DMSans.woff2) format('woff2');font-weight:100 1000;font-style:normal;font-display:swap}
@font-face{font-family:'DMSans';src:url(assets/DMSans-Italic.woff2) format('woff2');font-weight:100 1000;font-style:italic;font-display:swap}
body{margin:0}
a{color:#c42c14}a:hover{color:#510004}
input::placeholder,textarea::placeholder{color:#d98f86}

@keyframes monte{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes monteB{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes trace{from{stroke-dashoffset:1}}
@keyframes traceB{from{stroke-dashoffset:1}}
@keyframes point{from{transform:scale(0)}60%{transform:scale(1.35)}to{transform:scale(1)}}
@keyframes pointB{from{transform:scale(0)}60%{transform:scale(1.35)}to{transform:scale(1)}}
@keyframes pouls{0%,100%{box-shadow:0 0 0 0 rgba(196,44,20,.45)}60%{box-shadow:0 0 0 9px rgba(196,44,20,0)}}
@keyframes halo{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,.9))}50%{filter:drop-shadow(0 0 7px rgba(255,255,255,.95))}}
.an-monte{animation:monte .7s cubic-bezier(.2,.7,.2,1) both}
.an-trace{animation:trace 1.6s cubic-bezier(.4,0,.2,1) both}
.an-anneau{animation:trace 1.2s .5s cubic-bezier(.4,0,.2,1) both}
.an-pt{transform-box:fill-box;transform-origin:center;animation:point .5s cubic-bezier(.2,.7,.2,1) both}
.an-ici{animation:point .5s cubic-bezier(.2,.7,.2,1) both,halo 2.6s 2.4s ease-in-out infinite}
.an-pouls{animation:pouls 2s ease-out infinite}
.an-carte{transition:transform .2s ease,box-shadow .2s ease}
.an-carte:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(81,0,4,.14)}
.pg:hover .an-monte{animation-name:monteB}
.pg:hover .an-trace,.pg:hover .an-anneau{animation-name:traceB}
.pg:hover .an-pt{animation-name:pointB}
.pg:hover .an-ici{animation-name:pointB,halo}
@media (prefers-reduced-motion:reduce){.an-monte,.an-trace,.an-anneau,.an-pt,.an-ici,.an-pouls{animation:none}}
</style>
</helmet>
<div class="pg" style="width:390px;height:844px;box-sizing:border-box;background:#e6361d;color:#c42c14;font-family:'DMSans',system-ui,sans-serif;display:flex;flex-direction:column;background:#e6361d url(assets/grain.jpg) center/cover no-repeat;"><main role="status" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px"><svg viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="Deux tracés partis de loin qui se rejoignent" style="display:block;overflow:visible;"><path d="M 12.0 288.0 C 161.2 288.0 5.2 150.0 116.0 150.0" pathLength="1" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" class="an-trace" style="stroke-dasharray:1;stroke-dashoffset:0;animation-duration:2.2s;animation-delay:0.00s"/><path d="M 248.0 12.0 C 98.8 12.0 254.8 150.0 144.0 150.0" pathLength="1" fill="none" stroke="#f7beca" stroke-width="3" stroke-linecap="round" class="an-trace" style="stroke-dasharray:1;stroke-dashoffset:0;animation-duration:2.2s;animation-delay:0.15s"/><circle class="an-pt" cx="12.0" cy="288.0" r="5" fill="#ffffff" style="animation-delay:0.20s"/><circle class="an-pt" cx="248.0" cy="12.0" r="5" fill="#f7beca" style="animation-delay:0.35s"/><circle class="an-pt an-ici" cx="116.0" cy="150.0" r="7" fill="#ffffff" style="animation-delay:2.10s"/><circle class="an-pt an-ici" cx="144.0" cy="150.0" r="7" fill="#f7beca" style="animation-delay:2.25s"/></svg><p style="margin:0;font-size:30px;line-height:1.1;font-weight:500;letter-spacing:-.035em;color:#ffffff;text-align:center">On cherche ta buddy</p></main></div>
</x-dc>

</body>
</html>
