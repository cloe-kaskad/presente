<style>
@font-face{font-family:'Anton';src:url(assets/Anton.woff2) format('woff2');font-display:swap}
@font-face{font-family:'DMSans';src:url(assets/DMSans.woff2) format('woff2');font-weight:100 1000;font-style:normal;font-display:swap}
@font-face{font-family:'DMSans';src:url(assets/DMSans-Italic.woff2) format('woff2');font-weight:100 1000;font-style:italic;font-display:swap}
body{margin:0}
a{color:#c42c14}a:hover{color:#510004}
input::placeholder,textarea::placeholder{color:#d98f86}

@keyframes monte{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes monteB{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes trace{from{stroke-dashoffset:1}}
@keyframes traceB{from{stroke-dashoffset:1}}
@keyframes point{from{transform:scale(0)}60%{transform:scale(1.35)}to{transform:scale(1)}}
@keyframes pointB{from{transform:scale(0)}60%{transform:scale(1.35)}to{transform:scale(1)}}
@keyframes pouls{0%,100%{box-shadow:0 0 0 0 rgba(196,44,20,.45)}60%{box-shadow:0 0 0 9px rgba(196,44,20,0)}}
@keyframes halo{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,.9))}50%{filter:drop-shadow(0 0 7px rgba(255,255,255,.95))}}
.an-monte{animation:monte .7s cubic-bezier(.2,.7,.2,1) both}
.an-trace{animation:trace 1.6s cubic-bezier(.4,0,.2,1) both}
.an-anneau{animation:trace 1.2s .5s cubic-bezier(.4,0,.2,1) both}
.an-pt{transform-box:fill-box;transform-origin:center;animation:point .5s cubic-bezier(.2,.7,.2,1) both}
.an-ici{animation:point .5s cubic-bezier(.2,.7,.2,1) both,halo 2.6s 2.4s ease-in-out infinite}
.an-pouls{animation:pouls 2s ease-out infinite}
.an-carte{transition:transform .2s ease,box-shadow .2s ease}
.an-carte:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(81,0,4,.14)}
.pg:hover .an-monte{animation-name:monteB}
.pg:hover .an-trace,.pg:hover .an-anneau{animation-name:traceB}
.pg:hover .an-pt{animation-name:pointB}
.pg:hover .an-ici{animation-name:pointB,halo}
@media (prefers-reduced-motion:reduce){.an-monte,.an-trace,.an-anneau,.an-pt,.an-ici,.an-pouls{animation:none}}
@keyframes attend{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes attendB{0%,100%{opacity:.45}50%{opacity:1}}
.an-attend{animation:attend 1.8s ease-in-out infinite}
@keyframes flotte{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.an-flotte{animation:flotte 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.an-attend,.an-flotte{animation:none}}
</style>
</helmet>
<div class="pg" style="width:390px;height:844px;box-sizing:border-box;background:#e6361d;color:#c42c14;font-family:'DMSans',system-ui,sans-serif;display:flex;flex-direction:column;background:#e6361d url(assets/grain.jpg) center/cover no-repeat;"><main role="status" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px"><div style="position:relative;width:342px;height:230px;display:flex;align-items:center;justify-content:center"><div aria-hidden="true" style="position:absolute;inset:0;opacity:.26"><svg viewBox="0 0 342 230" width="342" height="230" role="img" aria-label="Deux voies qui avancent côte à côte" style="display:block;overflow:visible;"><path d="M 12.0 218.0 C 143.6 218.0 198.4 58.0 330.0 58.0" pathLength="1" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="an-trace" style="stroke-dasharray:1;stroke-dashoffset:0;animation-duration:2.2s;animation-delay:0.00s"/><path d="M 12.0 172.0 C 143.6 172.0 198.4 12.0 330.0 12.0" pathLength="1" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="an-trace" style="stroke-dasharray:1;stroke-dashoffset:0;animation-duration:2.2s;animation-delay:0.15s"/></svg></div><div style="position:relative"><span role="img" aria-label="Toi, et une place qui attend" style="display:inline-flex;gap:5px;align-items:center;flex:none"><span class="an-flotte" style="display:block"><span class="an-pt" style="box-sizing:border-box;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:43px;font-weight:600;line-height:1;flex:none;background:#ffffff;color:#e6361d;animation-delay:0.20s">C</span></span><span class="an-flotte" style="display:block;animation-delay:-1.6s"><span class="an-attend" style="box-sizing:border-box;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:43px;font-weight:600;line-height:1;flex:none;border:3px dashed #ffffff;background:rgba(255,255,255,.14)"></span></span></span></div></div><p style="margin:0;font-size:30px;line-height:1.1;font-weight:500;letter-spacing:-.035em;color:#ffffff;text-align:center">On cherche ta copine de&nbsp;voyage</p></main></div>
